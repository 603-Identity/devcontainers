# way-of-working plugin contract for this repo (schema v0.14.0).
# See reference/project-schema.md in the way-of-working plugin for the full key reference.
#
# Every value below was read from this repo on 2026-09-29: the check names come from the
# `name:` fields of the jobs in .github/workflows/, and the ruleset block from a live API
# read-back. Nothing was copied from a sibling repo's file without checking it here.

# ── identity ─────────────────────────────────────────────────────────────────
repo: 603-Identity/devcontainers
pr_base: main
migration_base: null   # no long-lived integration branch; work lands on main directly.

# ── the deep record ──────────────────────────────────────────────────────────
roadmap: docs/roadmap.md         # status, next action, and the decisions that bind this repo.
sprints_dir: sprints             # exists (sprints/README.md) so the path resolves, but holds no
                                 # plans: planning.kind is github_milestones (IAC-D48's companion
                                 # convention).
threat_model: docs/threat_model.md   # inputs, sinks, credential holders, boundaries, known
                                     # gaps. The record of reference: README.md § Security model
                                     # summarizes it and links here, never the other way round.

planning:
  kind: github_milestones   # one sprint = one milestone on this repo; its issues are the task
                            # list. Requires backlog.kind: github_issues (below).

decisions:
  log: docs/roadmap.md   # this repo's own DEVC-D decisions, plus a cited list of the org-wide
                         # IAC-D decisions (logged in infrastructure-core) that bind it.
  prefix: DEVC-D         # DEVC-D1, applying IAC-D48: a decision affecting only this repo is
                         # DEVC-D. One that changes another repo too (the image and token model,
                         # a toolchain version) is IAC-D in infrastructure-core's log.

backlog:
  kind: github_issues    # devcontainer work and planning live on this repo's own tracker.
  repo: null             # this repo. It is PUBLIC: an issue here must not carry private repos'
                         # internals. Link to a private issue instead of quoting it.
  path: null
  item_prefix: null

load_bearing_docs:
  - README.md
  - docs/roadmap.md
  - docs/threat_model.md
  - docs/adopting.md

# ── what counts as a behavior change ─────────────────────────────────────────
# Everything that decides what goes into a published image, how it is tested and published,
# or what a consuming repo's container does at runtime.
code_paths:
  - images/
  - template/            # copied into consuming repos (`.devcontainer/`, the two `.github/workflows/` callers, the root `.gitattributes`)
  - tests/               # the smoke test is the pre-push gate on every image
  - tools/               # devc-verify and the gate scripts: they decide what a consumer PR may
                         # merge, and the rendered gate template is checked against them.
  - .github/             # workflows, the build script, and dependabot.yml
  - .trivyignore.yaml    # an ALLOWLIST past the vulnerability gate: the one file where a real
                         # finding can be parked and the build stays green by design.
  - .gitattributes       # forces LF; a CRLF script or lock file breaks inside the image.
  - .ai/project.yml      # the source of truth for code_paths, the gate, the ruleset and the
                         # review gate. An edit weakening any of them must route to review.
  - .claude/             # the plugin pin, the merge-guard hook, and the force-push and --no-verify deny rules.
  - .devcontainer/       # this repo's own dev-App container: FROM pin, extras, token mount.

# ── the local green gate ─────────────────────────────────────────────────────
# A local pre-check, not the gate of record; CI on the PR is. Mirrors lint.yml's four jobs, verify-selftest.yml
# and build.yml's test job, with the same digest-pinned linter images. Needs Docker, git, jq, Go 1.26.8, node
# with npm, and a POSIX shell. The second-to-last step builds all five images (base, tofu, node and the two
# dev-App flavours) and runs the smoke tests and Trivy gate, so it takes several minutes; the last brings up
# the template against the devapp-tofu image it just built, with the pinned devcontainer CLI (about a minute).
gates:
  green:
    - { cwd: ".", run: "for f in images/*/Dockerfile template/.devcontainer/Dockerfile; do docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < \"$f\" || exit 1; done" }
    - { cwd: ".", run: "for d in images template; do docker run --rm -v \"$PWD:/src:ro\" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 config --quiet --severity HIGH,CRITICAL --exit-code 1 \"/src/$d\" || exit 1; done" }
    - { cwd: ".", run: "shellcheck images/base/files/*.sh images/devapp/files/gh images/devapp/files/dev-token images/devapp/files/devapp-check.sh images/devapp/files/claude-fetch.sh images/devapp/files/plugin-install.sh tests/*.sh .github/scripts/*.sh tools/*.sh tools/host/*.sh tools/tests/*.sh .claude/hooks/*.sh" }
    - { cwd: "tools/devc-verify", run: "GOWORK=off GOFLAGS=-mod=vendor GOPROXY=off GOTOOLCHAIN=local go test ./..." }
    - { cwd: ".", run: "bash tools/tests/run-gate-tests.sh" }
    - { cwd: ".", run: "docker run --rm -v \"$PWD:/repo:ro\" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 --offline .github/workflows template/.github/workflows" }
    - { cwd: ".", run: "bash .github/scripts/build-and-test.sh local" }
    - { cwd: ".", run: "bash tests/template-proof.sh" }

# ── branch protection ────────────────────────────────────────────────────────
# Both branch rulesets on `main`, read back live 2026-11-15 by id through
# `GET /repos/603-Identity/devcontainers/rulesets/<id>`: `enforcement: active`, no bypass actors.
#   main-approval (27334996): holds the `pull_request` rule (code-owner review, stale reviews
#     dismissed on push, last-push approval, 1 approving review), plus `deletion` and
#     `non_fast_forward`; on ~DEFAULT_BRANCH.
#   main-required-checks (24183176): `required_status_checks`, every check pinned to GitHub
#     Actions (integration_id 15368). It also still carries its own 0-approval `pull_request`
#     rule, which is to be removed from the live ruleset after this change merges:
#     ruleset-drift.sh judges the approval parameters on every ruleset carrying one.
# The check names are the jobs' own `name:` fields, not typed from memory (IAC-D14's
# absent-check trap); `architect-review` is the context review.ci_gate.check names, posted by
# review-gate.yml, not a job name.
#
# build.yml's "Build, test, push and attest" job is deliberately absent: it runs only on
# push to main, the schedule and manual dispatch, never on a pull request.
rulesets:
  - name: main-approval
    source: repo
    rule_types: [pull_request, deletion, non_fast_forward]
  - name: main-required-checks
    source: repo
    rule_types: [required_status_checks]
    required_checks:
      - "hadolint (Dockerfiles)"
      - "Trivy misconfiguration (Dockerfiles)"
      - "shellcheck (scripts)"
      - "zizmor (workflow security)"
      - "Build and smoke-test (no push)"
      - "architect-review"
      - "selftest"
    check_integrations:
      "hadolint (Dockerfiles)": 15368
      "Trivy misconfiguration (Dockerfiles)": 15368
      "shellcheck (scripts)": 15368
      "zizmor (workflow security)": 15368
      "Build and smoke-test (no push)": 15368
      "architect-review": 15368
      "selftest": 15368
  # The tag ruleset (target: tag): it holds the `v*` release tags and the `devc-automerge-*` kill
  # switch, and carries no required checks. Its only bypass actor is the release App
  # (`603id-devcontainers-release`, DEVC-D12); `ref_patterns` is what the live ruleset's
  # `conditions.ref_name.include` reads back today.
  - name: release-tags
    source: repo
    target: tag
    rule_types: [creation, update, deletion, non_fast_forward]
    ref_patterns: ["refs/tags/v*", "refs/tags/devc-automerge-*"]
# The legacy alias, still what most readers use: kept in step with the main-required-checks
# entry above by hand (the checker does not compare them).
ruleset:
  name: main-required-checks
  rule_types: [required_status_checks]
  required_checks:
    - "hadolint (Dockerfiles)"
    - "Trivy misconfiguration (Dockerfiles)"
    - "shellcheck (scripts)"
    - "zizmor (workflow security)"
    - "Build and smoke-test (no push)"
    - "architect-review"
    - "selftest"   # verify-selftest.yml's final job.

# ── the fresh-session review gate ────────────────────────────────────────────
# Only review-gate.yml posts `check`: the plugin's gate copied at claude-workbench v0.36.0, which
# reads `identities.reviewer_app` and these strings from the default branch's copy of this file.
# The cutover's PR 2 removed this repo's own architect-review-gate.yml; the template/ copy for
# consumers stays.
review:
  ci_gate:
    check: architect-review
    header: "**Opus/Architect HITL review (automated)**"
    attestation: "*Fresh-session review: this session did not author the diff.*"
    triggers_on: null   # review-gate.yml fires on code_paths, read from the default branch's
                        # copy of this file.

# ── agents ───────────────────────────────────────────────────────────────────
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
  diff_rule: null   # critic-gate's diff mode proposes and the human picks (way-of-working
                    # v0.26.0 migration; the maintainer's answer, 2026-11-15).
models:
  architect: opus
  coder: sonnet
  second_opinion: fable   # offered as an optional late critic-gate round on a different model;
                          # runs only when the human authorizes it in-session.

# ── the sprint-orchestrator loop ─────────────────────────────────────────────
orchestration: null   # the loop never dispatches into this repo (way-of-working v0.17.0
                      # migration; absent prompts).

# ── parallel lanes ───────────────────────────────────────────────────────────
# The directory that holds coder-lane worktrees, one per task issue. lane.sh, wow-lane.ps1 and
# resume's Lanes line read it from the default branch's copy of this file. /tmp is the per-repo
# named volume both dev container files already mount, so no mount is added.
lanes:
  dir: /tmp/lanes

# ── declared identities ──────────────────────────────────────────────────────
# The cutover's PR 1 (claude-workbench#411 step 6, #398). Each id is a numeric account id read
# back from the API: the maintainer's from `gh api users/JaredGroves-603`, each App's from
# `gh api users/<slug>[bot]` (the `user.id` on its reviews and PRs, not the App ID its settings
# page shows). The dev App exists but is not installed on this repo, and is not added to the
# token broker, until the approval side is confirmed (reference/cutover.md § The approval side).
identities:
  maintainer:
    - { login: JaredGroves-603, id: 281693088 }
  # commit_route api: the dev App's pushes replay through bin/api-commit.sh, so GitHub signs them (WB-D36).
  dev_app: { login: "603id-dev[bot]", id: 340163647, commit_route: api }
  reviewer_app: { login: "603id-review[bot]", id: 340164886 }
  loop_app: null   # orchestration is null: nothing acts as a loop App here.

# ── deployment environments ──────────────────────────────────────────────────
# The `release` environment is what release.yml's `release` job runs behind, and what the release
# App's key is a secret of: the one reviewed gate between a dispatch and a tag. The plugin's
# readback fails when the live reviewers, branch policy, branch names or admin bypass differ.
environments:
  - name: release
    reviewers:
      - { type: User, id: 281693088 }
    branch_policy: custom
    branches: [main]
    admins_can_bypass: false
