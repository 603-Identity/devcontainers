# Python tools every devcontainer carries, installed into /opt/devc/tools from uv.lock
# only (`uv sync --locked`, hashes verified). Not a package: it exists to hold the lock.
#
# bc-detect-secrets is Bridgecrew's fork, NOT Yelp's detect-secrets: the two reject
# each other's .secrets.baseline. Every 603 repo's baseline and CI secret-scan job pin
# the version below, so a bump (Dependabot may propose one) lands only together with
# those repos' baseline regeneration and CI pin.
[project]
name = "devc-tools"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "bc-detect-secrets==1.5.51",
    "pre-commit",
    "zizmor==1.30.1",
]

[tool.uv]
package = false
