# Trivy exceptions: findings the build gate (.github/scripts/build-and-test.sh) lets
# through. This file is an ALLOWLIST OF THINGS NOT TO ALERT ON, the same shape and the
# same risk as a .secrets.baseline, so every change to it is a reviewed diff.
#
# Rules for an entry:
#   * scope it by `paths` to the one binary it covers, never image-wide;
#   * give a `statement` saying WHY it cannot be fixed here today;
#   * set `expired_at` at most 30 days out. After that date Trivy ignores the entry,
#     and the weekly rebuild goes red until someone re-reviews it: extends it with a
#     fresh reason, or removes it because the fix has shipped.
#
# Current entries (the betterleaks ones re-reviewed 2026-11-03 against a local build of the
# rc.6 base image, the rest 2026-11-02; all set to expire 2026-12-01). Every one is a Go module or stdlib CVE compiled into an
# upstream release binary. Fixing it needs a new upstream build: we cannot rebuild these
# ourselves without giving up the upstream checksum verification that is the point of
# pinning them. The previous set expired 2026-11-01 (#148); this commit's bumps (gh
# 2.103.2, tofu 1.13.2, tflint 0.65.0, the Ubuntu digest, the Python lock) cleared the rest.
#   * yq has no entries: 4.54.2 (#496) scans clean, so its four 4.54.1 entries went.
#   * betterleaks is 2.0.0-rc.6 (Go 1.26.0, 26 findings; rc.1 had 13 on Go 1.25.12). rc.3
#     removed `git --log-opts` and `--staged`; the scan now chooses its commits with a caller-side
#     `git log` (our choice, over rc.6's own `git --revision`), so tools/secret-scan.sh
#     and tests/smoke.sh now feed `git log -p` to `stdin --git-diff`, which rc.1 does not
#     have (#449). Keeping rc.1 would mean keeping a `--log-opts` path that rc.3 and later
#     reject; the owner chose to take rc.6 with these exceptions instead (#449, superseding
#     #438). Every release that has the flag is on Go 1.26.0, so the bump trades 13 findings
#     for 26 (#402 and #416 declined it when it bought nothing). Reachability, as
#     this file asks for a scanner that reads repository content:
#     tools/secret-scan.sh scans a local git history only, refuses BETTERLEAKS_VALIDATE
#     and BETTERLEAKS_ANALYZE, and never passes -v or -a, so betterleaks opens no network
#     connection there; the net, net/http, net/url, net/mail, crypto/tls, crypto/x509 and
#     x/net http2 findings have no caller on that path (net/mail is parsed only for a mail-format
#     patch header, which the pinned `--pretty=medium` never produces). encoding/xml, encoding/asn1, html/template,
#     mime, os.Root and the x/net/idna and dnsmessage parsers may see repository content;
#     each is a denial of service or needs an attacker-controlled name or path the scan never
#     builds, and the wrapper treats a scan that does not complete as an error, so it fails
#     closed. A user who runs `betterleaks --validate` by hand does reach net/http.
#   * tofu 1.13.2 is the newest release (2026-10-21) and carries 5. tofu does make
#     network calls (registries, module sources, backends); none of the 5 is fixed
#     upstream yet. (1.13.2 cleared the 1.13.1 crypto/x509 finding.)
#   * tflint 0.65.0 is the newest release (2026-10-22) and carries 1 (go-jose).
#   * CVE-2026-78661 (GO-2026-6860, added 2026-11-06, #496): an O(n^2) denial of service in
#     golang.org/x/net/html's PARSER (addText, fosterParent); its tokenizer is not affected.
#     Fixed in x/net 0.62.0, which no gh (newest 2.103.3, trunk on 0.61.0), betterleaks
#     (rc.7 still 0.60.0), tofu (1.13.9 still 0.57.0) or tflint (0.65.0) release has yet.
#     Reachability, checked against the built images by the symbol names the Go linker
#     keeps (it drops unused functions; html.NewTokenizer, found in gh, is the control):
#     no html.Parse, html.(*parser) or html.fosterParent symbol is in any of the four.
#     gh links the tokenizer only; betterleaks, tofu and tflint link no x/net/html at all.
#     gh appears twice: usr/local/bin/gh, and usr/local/libexec/gh-real in the dev-App
#     images, the same file (equal sha256).
