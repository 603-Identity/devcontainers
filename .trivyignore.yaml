# Trivy exceptions: findings the build gate (.github/scripts/build-and-test.sh) lets
# through. This file is an ALLOWLIST OF THINGS NOT TO ALERT ON, the same shape and the
# same risk as a .secrets.baseline, so every change to it is a reviewed diff.
#
# Rules for an entry:
#   * scope it by `paths` to the one binary it covers, never image-wide;
#   * give a `statement` saying WHY it cannot be fixed here today;
#   * set `expired_at` at most 30 days out. After that date Trivy ignores the entry,
#     and the weekly rebuild goes red until someone re-reviews it: extends it with a
#     fresh reason, or removes it because the fix has shipped.
#
# Current entries (added 2026-09-28): Go module and stdlib CVEs compiled into
# upstream release binaries. Fixing them needs a new upstream build. We cannot rebuild
# tofu or tflint ourselves without giving up the upstream checksum verification that
# is the point of pinning them.
#   * tofu 1.12.6 is the newest 1.12.x. It must match every consuming repo's CI
#     (tofu_version in each setup-opentofu step), so the pin moves only together with them.
#     All 14 tofu entries below still match the 1.12.6 binary (re-checked 2026-09-30). The
#     1.13.0 binary (released 2026-09-30) clears 11 of the 14 and keeps only CVE-2026-56864,
#     CVE-2026-56865 and CVE-2026-84445; taking it is a further minor move, not this one.
#   * tflint 0.64.0 is the newest tflint release.
vulnerabilities:
