# Trivy exceptions: findings the build gate (.github/scripts/build-and-test.sh) lets
# through. This file is an ALLOWLIST OF THINGS NOT TO ALERT ON, the same shape and the
# same risk as a .secrets.baseline, so every change to it is a reviewed diff.
#
# Rules for an entry:
#   * scope it by `paths` to the one binary it covers, never image-wide;
#   * give a `statement` saying WHY it cannot be fixed here today;
#   * set `expired_at` at most 30 days out. After that date Trivy ignores the entry,
#     and the weekly rebuild goes red until someone re-reviews it: extends it with a
#     fresh reason, or removes it because the fix has shipped.
#
# Current entries (added 2026-09-28, re-reviewed 2026-10-01 and renewed to 2026-10-30):
# Go module and stdlib CVEs compiled into upstream release binaries. Fixing them needs a new upstream build. We cannot rebuild
# tofu or tflint ourselves without giving up the upstream checksum verification that
# is the point of pinning them.
#   * tofu 1.13.0 is the newest release (2026-09-30). It must match every consuming repo's CI
#     (tofu_version in each setup-opentofu step), so the pin moves only together with them.
#     Only 3 tofu entries remain: CVE-2026-56864, CVE-2026-56865 and CVE-2026-84445 (shared
#     with tflint, so they sit on the tflint-and-tofu entries below). The move from 1.12.6
#     cleared the other 11.
#   * tflint 0.64.0 is the newest tflint release (re-checked 2026-10-01: all 17 tflint
#     entries still match it, and no newer release exists).
vulnerabilities:
  - id: CVE-2026-27145
    paths: ["usr/local/bin/tflint"]
    statement: "HIGH in stdlib compiled into upstream tflint; no fixed upstream release at this pin."
    expired_at: 2026-10-30
