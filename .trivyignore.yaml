# Trivy exceptions: findings the build gate (.github/scripts/build-and-test.sh) lets
# through. This file is an ALLOWLIST OF THINGS NOT TO ALERT ON, the same shape and the
# same risk as a .secrets.baseline, so every change to it is a reviewed diff.
#
# Rules for an entry:
#   * scope it by `paths` to the one binary it covers, never image-wide;
#   * give a `statement` saying WHY it cannot be fixed here today;
#   * set `expired_at` at most 30 days out. After that date Trivy ignores the entry,
#     and the weekly rebuild goes red until someone re-reviews it: extends it with a
#     fresh reason, or removes it because the fix has shipped.
#
# Current entries (added 2026-09-28, re-reviewed 2026-10-02 and renewed to 2026-11-01):
# Go module and stdlib CVEs compiled into upstream release binaries. Fixing them needs
# a new upstream build. We cannot rebuild tofu or tflint ourselves without giving up
# the upstream checksum verification that is the point of pinning them.
#   * tofu is pinned at 1.13.0. A consumer moves tofu_version in the same PR that takes
#     the image digest (images/tofu/Dockerfile has the history). 1.13.1 (2026-10-01) is
#     out and carries the same 3 findings, so no tofu release fixes them yet:
#     CVE-2026-56864, CVE-2026-56865 and CVE-2026-84445 (shared with tflint, so they sit
#     on the tflint-and-tofu entries below). The move from 1.12.6 cleared the other 11.
#   * betterleaks is pinned at 2.0.0-rc.1 (#190), built with Go 1.25.12. 7 stdlib findings,
#     fixed in Go 1.25.13 and later; the newest betterleaks release is still rc.1 (checked
#     2026-10-03), so none fixes them yet. The scanner reads repository content, so when you
#     re-review these, check whether the affected package (encoding/xml, net/http, crypto/tls
#     and so on) is reachable from a scan before extending them.
#   * tflint 0.64.0 is the newest tflint release (re-checked 2026-10-02: all 17 tflint
#     entries still match it, and no newer release exists).
vulnerabilities:
