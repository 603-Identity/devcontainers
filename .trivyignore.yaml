# Trivy exceptions: findings the build gate (.github/scripts/build-and-test.sh) lets
# through. This file is an ALLOWLIST OF THINGS NOT TO ALERT ON, the same shape and the
# same risk as a .secrets.baseline, so every change to it is a reviewed diff.
#
# Rules for an entry:
#   * scope it by `paths` to the one binary it covers, never image-wide;
#   * give a `statement` saying WHY it cannot be fixed here today;
#   * set `expired_at` at most 30 days out. After that date Trivy ignores the entry,
#     and the weekly rebuild goes red until someone re-reviews it: extends it with a
#     fresh reason, or removes it because the fix has shipped.
#
# Current entries (re-scanned 2026-11-09 against the published 4.647 images, Trivy 0.74.0,
# DB 2026-11-09, no ignore file; every entry expires 2026-12-01, renewal is #484). Every one
# is a Go module CVE compiled into an upstream release binary. Fixing it needs a new
# upstream build: we cannot rebuild these ourselves without giving up the upstream checksum
# verification that is the point of pinning them. Pins at the scan: gh 2.103.3, betterleaks
# 2.0.0-rc.7, tofu 1.13.9, tflint 0.66.0, yq 4.54.3.
#   * yq has no entries: it has scanned clean since 4.54.2 (#496).
#   * tflint has no entries: 0.66.0 ships go-jose/v4 4.1.6 and x/net 0.62.0, which fix
#     both findings 0.65.0 carried (#516).
#   * betterleaks carries only CVE-2026-78661 (below). rc.7 is built with the current Go
#     release, which cleared the 26 Go stdlib findings rc.6 carried on Go 1.26.0 (#509).
#     (rc.3 and later are needed for `stdin --git-diff`, which tools/secret-scan.sh uses,
#     #449.)
#   * tofu 1.13.9 is the newest release (2026-11-05) and carries 5 besides CVE-2026-78661.
#     tofu does make network calls (registries, module sources, backends); none of the 5
#     is fixed upstream yet. 1.13.9's go.mod is unchanged from 1.13.2, so the set is the same.
#   * CVE-2026-78661 (GO-2026-6860, added 2026-11-06, #496): an O(n^2) denial of service in
#     golang.org/x/net/html's PARSER (addText, fosterParent); its tokenizer is not affected.
#     Fixed in x/net 0.62.0, which no gh (newest 2.103.3, trunk on 0.61.0), betterleaks
#     (rc.7 on 0.60.0) or tofu (1.13.9 on 0.57.0) release has yet.
#     Reachability, checked against the built images by the symbol names the Go linker
#     keeps (it drops unused functions; html.NewTokenizer, found in gh, is the control):
#     no html.Parse, html.(*parser) or html.fosterParent symbol is in any of the three.
#     gh links the tokenizer only; betterleaks and tofu link no x/net/html at all.
#     gh appears twice: usr/local/bin/gh, and usr/local/libexec/gh-real in the dev-App
#     images, the same file (equal sha256).
vulnerabilities:
  - id: CVE-2026-116587
    paths: ["usr/local/bin/tofu"]
    statement: "HIGH in github.com/go-jose/go-jose/v4 compiled into upstream tofu 1.13.9; no fixed upstream release."
    expired_at: 2026-12-01
  - id: CVE-2026-56864
    paths: ["usr/local/bin/tofu"]
    statement: "HIGH in golang.org/x/mod compiled into upstream tofu 1.13.9; no fixed upstream release."
    expired_at: 2026-12-01
  - id: CVE-2026-56865
    paths: ["usr/local/bin/tofu"]
    statement: "HIGH in golang.org/x/mod compiled into upstream tofu 1.13.9; no fixed upstream release."
    expired_at: 2026-12-01
  - id: CVE-2026-78669
    paths: ["usr/local/bin/tofu"]
    statement: "HIGH in golang.org/x/net compiled into upstream tofu 1.13.9; no fixed upstream release."
    expired_at: 2026-12-01
  - id: CVE-2026-84445
    paths: ["usr/local/bin/tofu"]
    statement: "HIGH in google.golang.org/grpc compiled into upstream tofu 1.13.9; no fixed upstream release."
    expired_at: 2026-12-01
  - id: CVE-2026-78661
    paths: ["usr/local/bin/gh", "usr/local/libexec/gh-real"]
    statement: "HIGH in golang.org/x/net/html's parser (addText/fosterParent); x/net v0.60.0 is in upstream gh 2.103.3's module list; no fixed gh release (trunk is on v0.61.0). The binary has no html.Parse, html.(*parser) or html.fosterParent symbol: it links the tokenizer only (#496)."
    expired_at: 2026-12-01
  - id: CVE-2026-78661
    paths: ["usr/local/bin/betterleaks"]
    statement: "HIGH in golang.org/x/net/html's parser (addText/fosterParent); x/net v0.60.0 is in upstream betterleaks 2.0.0-rc.7's module list; no fixed release. The binary has no html.Parse, html.(*parser) or html.fosterParent symbol: no x/net/html package is linked at all (#496)."
    expired_at: 2026-12-01
  - id: CVE-2026-78661
    paths: ["usr/local/bin/tofu"]
    statement: "HIGH in golang.org/x/net/html's parser (addText/fosterParent); x/net v0.57.0 is in upstream tofu 1.13.9's module list; no fixed release. The binary has no html.Parse, html.(*parser) or html.fosterParent symbol: no x/net/html package is linked at all (#496)."
    expired_at: 2026-12-01
