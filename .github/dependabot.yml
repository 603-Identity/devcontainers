version: 2
# What Dependabot can bump here, and what it cannot:
#   * github-actions: the SHA-pinned actions in .github/workflows/.
#   * docker: images/base's `FROM ubuntu:26.04@sha256:...` digest. The tofu and node
#     Dockerfiles have no fixed FROM to bump (it is a build arg, set by CI).
#   * uv: images/base/tools/pyproject.toml -> uv.lock (hashes kept).
# NOT bumped by Dependabot: the ARG-pinned binaries (gh, yq, uv, tofu, tflint, node,
# npm), and the `# syntax=docker/dockerfile:...@sha256:...` line in all four
# Dockerfiles (the docker updater reads only FROM lines; bump the four together,
# digest from `docker buildx imagetools inspect`, see README.md). The binaries are
# proposed instead by .github/workflows/bump-binaries.yml (see README.md §
# Updating a pinned tool); fall back to a manual PR, same section, only while that
# workflow is down or for a tool it doesn't cover. A consuming repo moves its
# setup-opentofu `tofu_version` in the same PR that takes the image digest with a new tofu.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /images/base
    schedule:
      interval: weekly

  # tools/devc-verify's vendored Go modules (buildkit's Dockerfile parser, hujson). A bump
  # changes vendor/ and go.sum together; the buildkit pin is tied to the allowed
  # `# syntax=` values by a unit test, so a bump that breaks the mapping fails CI.
  - package-ecosystem: gomod
    directory: /tools/devc-verify
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /images/base/tools
    schedule:
      interval: weekly
    groups:
      python-tools:
        patterns: ["*"]
