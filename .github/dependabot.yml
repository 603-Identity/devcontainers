version: 2
# What Dependabot can bump here, and what it cannot:
#   * github-actions: the SHA-pinned actions in .github/workflows/.
#   * docker: images/base's `FROM ubuntu:26.04@sha256:...` digest. The tofu and node
#     Dockerfiles have no fixed FROM to bump (it is a build arg, set by CI).
#   * uv: images/base/tools/pyproject.toml -> uv.lock (hashes kept).
# NOT bumped by any bot: the ARG-pinned binaries (gh, yq, uv, tofu, tflint, node) and
# the `# syntax=docker/dockerfile:...@sha256:...` line in all four Dockerfiles (the
# docker updater reads only FROM lines; bump the four together, digest from
# `docker buildx imagetools inspect`, see README.md). Each binary
# bump is a manual PR that takes the new sha256 from that release's own checksum
# file (see README.md § Updating a pinned tool). Tofu moves only in step with
# every consuming repo's setup-opentofu pin.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /images/base
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /images/base/tools
    schedule:
      interval: weekly
    groups:
      python-tools:
        patterns: ["*"]
