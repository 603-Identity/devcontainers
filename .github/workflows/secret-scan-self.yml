name: Secret scan (self-test)

# This repo scans itself with its own reusable workflow, from the PR's merge ref: the one
# caller allowed to skip the SHA pin (the guard checks the repo and the exact ref). The job id
# `secrets` plus the reusable job `scan` makes the check `secrets / scan`, the name consumers
# will require.
on:
  pull_request:

permissions: {}

jobs:
  secrets:
    permissions:
      contents: read
    uses: $/.github/workflows/secret-scan.yml
