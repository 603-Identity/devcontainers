name: Trivy daily scan

# Daily scan of the five PUBLISHED images (docs/trivy-renewal.md, Early warning): it pulls them by
# digest, builds nothing, scans library packages with the build gate's Trivy image, severity settings
# and .trivyignore.yaml, and opens or updates one issue per vulnerability id it finds. It is NOT a
# required check: do not add "Trivy daily scan (not required)" to the main-required-checks ruleset or
# to .ai/project.yml's required checks.
#
# It lives in its own workflow, not in build.yml, so its red run never changes the conclusion of a
# build.yml run: .github/scripts/last-publish-sha.sh and tools/live-verify.sh select build.yml runs
# by run-level success. There is no `push` trigger for the same reason as trivy-expiry.yml's: the
# release verifier refuses a release when any push run on main is not green. There is no
# `pull_request` trigger either: the job holds `issues: write`.
on:
  schedule:
    - cron: "41 5 * * *"   # daily 05:41 UTC, not the Monday 06:17 slot of build.yml and trivy-expiry.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: trivy-daily
  cancel-in-progress: false

jobs:
  trivy-daily:
    name: Trivy daily scan (not required)
    if: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve, scan and parse the published images
        id: scan
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/trivy-daily"
          mkdir -p "$d"
          bash .github/scripts/trivy-daily.sh resolve "$d/refs.tsv"
          bash .github/scripts/trivy-daily.sh scan "$d/refs.tsv" "$d"
          bash .github/scripts/trivy-daily.sh parse "$d/refs.tsv" "$d" "$d/findings.tsv" "$d/summary.tsv"
      - name: File the findings as issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/trivy-daily"
          bash .github/scripts/trivy-daily.sh file "$d/findings.tsv" "$d/summary.tsv"
