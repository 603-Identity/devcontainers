name: Secret scan

# Reusable workflow (spec: issue #190). A consuming repo's PR workflow calls this as the job
# `secrets`, so the required check is literally `secrets / scan`. On every consumer pull
# request it runs Betterleaks over the FULL ancestry of the PR head, with the org rule set from
# this repo and the scanner version pinned in images/base/Dockerfile (BETTERLEAKS_VERSION and
# BETTERLEAKS_SHA256), both read at the caller's pin (job.workflow_sha). No inputs, no secrets,
# no write permission anywhere.
#
# Trust: the scanner, the org config and tools/secret-scan.sh all come from this repo at the
# caller's pin. The consumer is checked out at the PR's BASE commit, so its config and ignore
# file are reviewed code, never the PR's own; the head is fetched by SHA and scanned as history.
# Consumer content is data here: nothing from it is executed.
on:
  workflow_call:

permissions: {}

jobs:
  scan:
    # No `name:` override and no job-level `if:`: the check must be `secrets / scan` and
    # must always report.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      CALLER_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Guard the event, the pin and the commits
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          # pull_request only, never pull_request_target: nothing here may run with a write token
          # against a fork's content.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error::secret-scan runs on pull_request only (got '$EVENT_NAME')."
            exit 1
          fi
          # A caller pinned to a branch or tag would run mutable code. The one exemption is this
          # repo's own self-test caller, which uses the local path and so runs the workflow from
          # the PR's merge ref. All three conditions must hold; a consumer-shaped caller using
          # any refs/pull/* ref fails.
          self_repo='603-Identity/devcontainers'
          if [[ "$WORKFLOW_REF" =~ @[0-9a-f]{40}$ ]]; then
            :
          elif [ "$CALLER_REPO" = "$self_repo" ] \
            && [ "${WORKFLOW_REF%%/.github/workflows/*}" = "$self_repo" ] \
            && [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] \
            && [ "${WORKFLOW_REF##*@}" = "refs/pull/${PR_NUMBER}/merge" ]; then
            echo "self-test caller: running from the PR merge ref."
          else
            echo "::error::pin this workflow to a full commit SHA (@<sha> # vX.Y), not a ref."
            exit 1
          fi
          for v in BASE_SHA HEAD_SHA; do
            if ! [[ "${!v}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not resolve $v to a full commit SHA."
              exit 1
            fi
          done

      - name: Check out the scanner tooling at the caller's pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 603-Identity/devcontainers
          ref: ${{ job.workflow_sha }}
          path: devc
          sparse-checkout: |
            images/base/Dockerfile
            secret-scan
            tools/secret-scan.sh
            tools/secret-scan-lint.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The version and sha256 live in exactly one place: the base image's Dockerfile ARGs.
      - name: Install Betterleaks and the org config
        run: |
          set -euo pipefail
          df=devc/images/base/Dockerfile
          ver="$(sed -n 's/^ARG BETTERLEAKS_VERSION=//p' "$df")"
          sha="$(sed -n 's/^ARG BETTERLEAKS_SHA256=//p' "$df")"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::BETTERLEAKS_VERSION / BETTERLEAKS_SHA256 missing or malformed in $df."
            exit 1
          fi
          bin="$RUNNER_TEMP/betterleaks-bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 \
            "https://github.com/betterleaks/betterleaks/releases/download/v${ver}/betterleaks_${ver}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/betterleaks.tar.gz"
          echo "${sha}  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$bin" betterleaks
          "$bin/betterleaks" version
          # A repo config extends the org config by this absolute path (the same path the
          # shared image ships it at), so the same config resolves here and in the container.
          sudo install -D -m 0644 devc/secret-scan/org.toml /usr/local/share/devc/secret-scan/org.toml

      # The BASE commit: the PR's own config, ignore file and .gitattributes never take effect.
      - name: Check out the consumer at the PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head by SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          cd repo
          # The head may live in a fork: refs/pull/N/head is how the base repo names it.
          git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          got="$(git rev-parse --verify refs/remotes/pr/head)"
          if [ "$got" != "$HEAD_SHA" ]; then
            echo "::error::the PR head moved while the job ran (event $HEAD_SHA, fetched $got); re-run."
            exit 1
          fi
          git rev-parse --verify --quiet "${BASE_SHA}^{commit}" > /dev/null
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Scan the full ancestry of the PR head
        env:
          BETTERLEAKS_DIR: ${{ runner.temp }}/betterleaks-bin
        run: |
          set -euo pipefail
          export BETTERLEAKS="$BETTERLEAKS_DIR/betterleaks" REPO_DIR="$PWD/repo"
          bash devc/tools/secret-scan.sh
