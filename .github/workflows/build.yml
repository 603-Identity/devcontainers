name: Build images

# Pull requests: build every image and smoke-test it, then push nothing. The job holds
# no write permission at all.
# main, the weekly schedule and manual dispatch ON main: build, test, push to GHCR, then
# attach a signed build-provenance attestation to each pushed digest. A manual dispatch
# on any other branch runs no job at all.
# actions/attest makes provenance by default and an SBOM attestation when given
# sbom-path (it replaced the deprecated attest-build-provenance and attest-sbom).
#
# Why a weekly rebuild: apt packages are not version-pinned (see images/base/
# Dockerfile), so security fixes reach the images only by rebuilding. A rebuild
# produces new digests under new tags, and consuming repos pick them up through
# Dependabot PRs. Nothing floats underneath a repo without a reviewed diff.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/603-identity
  # Image tags are "<MAJOR>.<workflow run number>", for example 3.42. The run number
  # grows with every run, so the tag is version-shaped and Dependabot's docker
  # ecosystem can bump consumers' FROM lines. Raise MAJOR by hand when an image's
  # contract breaks (a tool removed, a path moved), so the bump reads as breaking.
  MAJOR: "4"

jobs:
  test:
    name: Build and smoke-test (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A docs-only PR skips the slow steps below. The JOB still runs and passes, because
      # this job's name is a required check: a workflow filtered out with `on.paths` never
      # reports, and the check would stay pending forever. A script over the changed files,
      # not a path-filter action, so no third-party Action holds this job's token. What
      # counts, and why the diff is read the way it is, is in the script's header; the
      # tools/tests/image-scope-test.sh suite pins it.
      - name: Did the images or the template change?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/image-scope.sh

      - name: Build and test all images
        if: steps.scope.outputs.build == '1'
        run: bash .github/scripts/build-and-test.sh local

      # Brings up template/.devcontainer/ against the devcontainer-tofu:local image built
      # above, with the pinned devcontainer CLI, and asserts its runArgs, volumes and
      # startup scripts from inside the container (see the header of the script).
      - name: Prove the template
        if: steps.scope.outputs.build == '1'
        run: bash tests/template-proof.sh

  # Every push to main used to publish a new tag set, docs-only pushes included, and each
  # tag set is a Dependabot bump PR in every consumer. Publish only when something that
  # affects an image changed since the last successful publish. The weekly schedule and
  # manual dispatch always do.
  # A push is diffed against the commit of the newest main run whose publish JOB concluded
  # success (last-publish-sha.sh), not against its own `before`: concurrency cancels a pending
  # run when a newer push queues, and a publish can fail, so `before` would lose that change
  # to the next docs-only push (#159). A run whose publish was skipped also reads `success`,
  # hence the job level. A failed lookup, or none found among the newest 100 successful runs,
  # builds: it fails toward publishing. `actions: read` is for that lookup and is this job's
  # alone; the publish job holds no read of the run list.
  # This job is not a required check, so skipping the publish job below leaves PRs alone.
  scope:
    name: Did the push change an image?
    if: contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # list main's build.yml runs and their jobs (last-publish-sha.sh)
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a push needs a base: the schedule and dispatch always build, and image-scope.sh
      # decides that before it reads BASE_SHA.
      - name: Find the last successful publish
        id: last
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/last-publish-sha.sh

      - name: Did the images or the template change?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.last.outputs.base }}
        run: bash .github/scripts/image-scope.sh

  # The event/ref clauses (an event allowlist, so a new trigger fails closed) repeat scope's
  # guard on purpose: this job holds the packages, id-token and attestations write tokens, so it
  # must not rely on another job's `if:` alone to stay off pull requests and non-main refs
  # (#160). Do not drop them as redundant.
  publish:
    name: Build, test, push and attest
    needs: scope
    if: contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' && needs.scope.outputs.build == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io/603-identity
      id-token: write        # Sigstore signing for the attestations
      attestations: write    # store the attestations on this repo
      artifact-metadata: write # record each pushed digest as an artifact storage record
      security-events: write # upload Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build, test and push
        id: push
        env:
          TAG: ${{ env.MAJOR }}.${{ github.run_number }}
        run: bash .github/scripts/build-and-test.sh push "$TAG"

      - name: Attest base
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/devcontainer-base
          subject-digest: ${{ steps.push.outputs.base_digest }}
          push-to-registry: true

      - name: Attest tofu
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/devcontainer-tofu
          subject-digest: ${{ steps.push.outputs.tofu_digest }}
          push-to-registry: true

      - name: Attest node
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/devcontainer-node
          subject-digest: ${{ steps.push.outputs.node_digest }}
          push-to-registry: true

      # SBOMs (CycloneDX, generated by the scan step), attested per digest so anyone
      # can check what is in an image:
      #   gh attestation verify oci://<image>@<digest> --repo 603-Identity/devcontainers \
      #     --cert-identity https://github.com/603-Identity/devcontainers/.github/workflows/build.yml@refs/heads/main \
      #     --cert-oidc-issuer https://token.actions.githubusercontent.com \
      #     --source-ref refs/heads/main --deny-self-hosted-runners \
      #     --predicate-type https://cyclonedx.org/bom
      - name: Attest SBOM (base)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/devcontainer-base
          subject-digest: ${{ steps.push.outputs.base_digest }}
          sbom-path: out/base.cdx.json
          push-to-registry: true

      - name: Attest SBOM (tofu)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/devcontainer-tofu
          subject-digest: ${{ steps.push.outputs.tofu_digest }}
          sbom-path: out/tofu.cdx.json
          push-to-registry: true

      - name: Attest SBOM (node)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/devcontainer-node
          subject-digest: ${{ steps.push.outputs.node_digest }}
          sbom-path: out/node.cdx.json
          push-to-registry: true

      # The FULL findings (unfixed and allowlisted included) go to code scanning, so
      # the Security tab shows everything the gate chose not to block on. One category
      # per image keeps their alerts from overwriting each other.
      - name: Upload scan (base)
        if: always() && steps.push.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: out/base.sarif
          category: trivy-base
      - name: Upload scan (tofu)
        if: always() && steps.push.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: out/tofu.sarif
          category: trivy-tofu
      - name: Upload scan (node)
        if: always() && steps.push.outcome == 'success'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: out/node.sarif
          category: trivy-node

      - name: Summary
        env:
          TAG: ${{ env.MAJOR }}.${{ github.run_number }}
          BASE: ${{ steps.push.outputs.base_digest }}
          TOFU: ${{ steps.push.outputs.tofu_digest }}
          NODE: ${{ steps.push.outputs.node_digest }}
        run: |
          {
            echo "### Published $TAG"
            echo '```'
            echo "$REGISTRY/devcontainer-base:$TAG@$BASE"
            echo "$REGISTRY/devcontainer-tofu:$TAG@$TOFU"
            echo "$REGISTRY/devcontainer-node:$TAG@$NODE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
