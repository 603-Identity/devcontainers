name: Trivy exceptions expiry

# Early warning for .trivyignore.yaml: the job lists every exception that expires within 10 days
# and fails when there are any (docs/trivy-renewal.md). It is NOT a required check: do not add
# "Trivy exceptions near expiry (not required)" to the main-required-checks ruleset or to
# .ai/project.yml's required checks, or every PR would go red in the last 10 days of an entry.
#
# It lives in its own workflow, not in build.yml, so its red run never changes the conclusion
# of a build.yml run: .github/scripts/last-publish-sha.sh and tools/live-verify.sh select
# build.yml runs by run-level success. There is no `push` trigger for the same reason: the
# release verifier refuses a release when any push run on main is not green.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC, the same slot as build.yml
  workflow_dispatch:

permissions: {}

jobs:
  trivy-expiry:
    name: Trivy exceptions near expiry (not required)
    if: ${{ github.event_name == 'pull_request' || (contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List exceptions that expire within 10 days
        run: bash .github/scripts/trivy-expiry.sh .trivyignore.yaml
