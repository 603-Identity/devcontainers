    paths: ["usr/local/bin/tofu"]
    statement: "HIGH or CRITICAL in github.com/go-jose/go-jose/v4 v4.1.4 compiled into upstream tofu 1.13.9; no fixed upstream release."
    expired_at: 2026-12-17
  - id: CVE-2026-56864
