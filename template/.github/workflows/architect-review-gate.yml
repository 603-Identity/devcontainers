name: Architect Review Gate

# GENERATED by tools/render-gate.sh from tools/gate-template.yml.in, tools/gate-resolve.sh and
# tools/gate-post.sh in 603-Identity/devcontainers. The `run:` blocks below are those scripts,
# byte for byte; that repo's selftest fails when they differ. In a consuming repo, edit only
# the PER-CONSUMER regions (marked `>>> CONSUMER` / `<<< CONSUMER`), never the logic.
#
# Per-consumer values, and nothing else:
#   * the `case` block in the `post` job's run block: this repo's code_paths, as globs.
#     The `.github/` rule just above it is NOT consumer-editable: a changed file under
#     `.github/` is always in review scope, whatever the list says. That is what makes a pin
#     bump of `decide` (which edits only .github/) always need review.
#   * REVIEWER_IDS, HEADER and ATTESTATION in the workflow-level `env` below.
#   * the `decide` pin, as `@<sha> # vX.Y` (a bare tag fails the reusable workflow's SHA check).
#
# review.ci_gate (.ai/project.yml): stays red on a PR that touches code_paths until a
# fresh-session review is posted as a formal PR review made against the PR's CURRENT head
# commit (its `commit_id` is the head SHA; a PR comment never counts), and whose body has the line
# `Reviewed against head <that SHA>` (#278), so a review stamped onto a head that moved during it fails.
# An edited review counts only if every editor in its edit history is in REVIEWER_IDS too (#94).
# An edit or a dismissal re-runs the gate (#315, #281), so on a same-repo PR the status follows the
# review as it is now, not as it was when the status went green. The early stop keys on the review's
# AUTHOR (github.event.review.user.id), not on whoever edited or dismissed it: an edit by a stranger
# to a reviewer's review still re-runs the gate, which then disqualifies that review (the status
# fails unless another qualifying review exists). A fork PR's run has a read-only token, so there
# the status moves only on the reviewer's allowlisted re-run comment (see below).
# HEADER and ATTESTATION must match review.ci_gate.header/.attestation in .ai/project.yml
# byte for byte. This is a literal substring match, not an intent match: a
# paraphrase turns the check red, and the failure looks like a review problem.
#
# This is an EXISTENCE gate, not a verdict gate. It checks that a fresh-session review was
# posted, not what the review concluded; the human still reads it before merging. A review
# counts only when its author's numeric user ID is in REVIEWER_IDS, since anyone
# can paste the two strings. Not author_association: org membership can be private, and this
# job's token then reads it as CONTRIBUTOR. IDs, not logins, because a released login can be
# claimed by someone else.
#
# Three jobs. `resolve` reads API facts only (it parses no PR content) and decides whether the
# run acts and whether the head commit is a candidate for the verified-image-bump exemption.
# `decide` is the reusable workflow that fully verifies a candidate. `post` is the only job
# with a write token, and the one place the `architect-review` status is decided. `resolve`
# and `post` have `run:` steps only (no `uses:`), so upstream action code, which Dependabot
# bumps, never shares a runner with the status token. No job is named `architect-review`, so
# no job check-run collides with the status of that name.
#
# For issue_comment events, GitHub attaches the job's implicit check-run to the DEFAULT
# BRANCH's tip, not the PR's head, so `post` posts the commit STATUS against the head SHA it
# resolved. The job exits 0 when no review is found: enforcement lives entirely in the status.
#
# issue_comment runs use the workflow file on the DEFAULT branch; pull_request and
# pull_request_review runs use the PR's own copy. So a comment re-evaluates a PR with main's
# gate, and a formal review with the PR's. A comment never counts toward the status; it only
# re-runs the gate. So on a fork PR, whose pull_request_review token is read-only, the reviewer
# posts the formal review and then an allowlisted comment, and main's gate finds the review.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

# >>> CONSUMER: review values
env:
  # Space-separated numeric GitHub user IDs whose formal review counts.
  # 281693088 = JaredGroves-603. A PR changing this list is checked by its own edited copy on
  # pull_request and pull_request_review runs, so the human's merge is the real control on it.
  REVIEWER_IDS: "281693088"
  HEADER: "**Opus/Architect HITL review (automated)**"
  ATTESTATION: "*Fresh-session review: this session did not author the diff.*"
  CONTEXT: architect-review
# <<< CONSUMER: review values

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issue_comment also fires for comments on plain issues; only the PR case has
    # github.event.issue.pull_request.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    permissions:
      contents: read        # the PR's head SHA, files and commits
      pull-requests: read
      issues: read
    outputs:
      act: ${{ steps.resolve.outputs.act }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr: ${{ steps.resolve.outputs.pr }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      candidate_pr: ${{ steps.resolve.outputs.candidate_pr }}
    steps:
      - name: Resolve the PR, its head commit and the bump candidate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ACTOR_ID: ${{ github.event.comment.user.id || github.event.review.user.id }}
        run: |
          # Logic of the `resolve` job of architect-review-gate.yml (design spec v5.2 section 4).
          #
          # This file is the one copy: tools/render-gate.sh inlines it, byte for byte, into the
          # `run:` block of template/.github/workflows/architect-review-gate.yml, and the selftest
          # fails unless the template matches. Edit it here, never in the template.
          #
          # It parses no PR content: it reads only API facts (ids, shas, refs, file counts, commit
          # verification) and writes each output either as a literal true/false or as a value that
          # passed a regex. Strings reach it through `env`, never through inline expressions.
          #
          # Inputs (env):
          #   GH_TOKEN        token for `gh api`
          #   GITHUB_OUTPUT   file the outputs are appended to
          #   REPO            owner/name of this repo
          #   EVENT_NAME      github.event_name
          #   PR_NUMBER       github.event.pull_request.number || github.event.issue.number
          #   ACTOR_ID        github.event.comment.user.id || github.event.review.user.id
          #   REVIEWER_IDS    space-separated numeric user ids whose comment or review re-runs the gate
          # Outputs: act, head_sha, pr, candidate, candidate_pr (candidate_pr only when candidate=true).
          set -euo pipefail

          DEPENDABOT_ID=49699333
          BUMP_FILE=.devcontainer/Dockerfile

          : "${GITHUB_OUTPUT:?}" "${REPO:?}" "${EVENT_NAME:?}"

          out_bool() {
            case "$2" in
              true | false) printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Refusing to write output $1: not a boolean."; exit 1 ;;
            esac
          }
          out_match() { # name value regex
            if [[ "$2" =~ $3 ]]; then
              printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Refusing to write output $1: value failed its regex."
              exit 1
            fi
          }

          # 1. Find the PR. The job-level `if:` already limits issue_comment events to PRs.
          if ! [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a PR number from event '${EVENT_NAME}'."
            exit 1
          fi

          # 2. Early stop. A comment or review re-runs the gate only when its author is in
          # REVIEWER_IDS. Any other event name is not one this gate handles: stop, fail closed.
          act=false
          case "$EVENT_NAME" in
            pull_request) act=true ;;
            issue_comment | pull_request_review)
              actor="${ACTOR_ID:-}"
              if [[ "$actor" =~ ^[0-9]+$ && " ${REVIEWER_IDS:-} " == *" ${actor} "* ]]; then
                act=true
              fi
              ;;
          esac
          if [ "$act" != true ]; then
            out_bool act false
            out_bool candidate false
            out_match pr "$PR_NUMBER" '^[0-9]+$'
            echo "Event '${EVENT_NAME}' is not from a reviewer in REVIEWER_IDS: nothing to do."
            exit 0
          fi

          # 3. Head SHA of the PR that triggered the run.
          head_sha="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve PR #${PR_NUMBER}'s head commit."
            exit 1
          fi

          # 4. Candidacy, keyed on the SHA, never on the PR that triggered the run. Every call is
          # captured into a variable, so a failing `gh api` aborts under `set -e` and can never read
          # as "no candidate".
          default_branch="$(gh api "repos/${REPO}" --jq '.default_branch // empty')"
          if [ -z "$default_branch" ]; then
            echo "::error::Could not resolve the default branch of ${REPO}."
            exit 1
          fi
          sha_prs="$(gh api "repos/${REPO}/commits/${head_sha}/pulls" --paginate | jq -s 'add // []')"
          # Cheap filters on the list first: open, same repo, same SHA, default branch, Dependabot's
          # user id, a docker-ecosystem branch.
          numbers="$(printf '%s' "$sha_prs" | jq -r \
            --arg sha "$head_sha" --arg repo "$REPO" --arg base "$default_branch" --argjson uid "$DEPENDABOT_ID" '
            .[]
            | select(.state == "open"
                and .head.sha == $sha
                and ((.head.repo.full_name // "") | ascii_downcase) == ($repo | ascii_downcase)
                and .base.ref == $base
                and .user.id == $uid
                and ((.head.ref // "") | startswith("dependabot/docker/")))
            | .number')"

          survivors=()
          for n in $numbers; do
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            # Exactly one file, modified, +1/-1, no rename.
            files="$(gh api "repos/${REPO}/pulls/${n}/files" --paginate | jq -s 'add // []')"
            if ! printf '%s' "$files" | jq -e --arg f "$BUMP_FILE" '
                length == 1 and (.[0]
                  | .filename == $f and .status == "modified" and .additions == 1 and .deletions == 1
                    and ((.previous_filename // null) == null))' > /dev/null; then
              continue
            fi
            # Every commit verified by GitHub, authored by Dependabot, and the head among them.
            commits="$(gh api "repos/${REPO}/pulls/${n}/commits" --paginate | jq -s 'add // []')"
            if ! printf '%s' "$commits" | jq -e --arg sha "$head_sha" --argjson uid "$DEPENDABOT_ID" '
                length > 0 and any(.[]; .sha == $sha)
                and all(.[]; .commit.verification.verified == true
                             and .commit.verification.reason == "valid"
                             and .author.id == $uid)' > /dev/null; then
              continue
            fi
            # The head must not have moved while the files and commits were read.
            now="$(gh api "repos/${REPO}/pulls/${n}" --jq '[.head.sha, .state] | join(" ")')"
            if [ "$now" != "${head_sha} open" ]; then
              continue
            fi
            survivors+=("$n")
          done

          # 5. Outputs. Exactly one survivor makes a candidate (two PRs can share a SHA).
          out_bool act true
          out_match head_sha "$head_sha" '^[0-9a-f]{40}$'
          out_match pr "$PR_NUMBER" '^[0-9]+$'
          if [ "${#survivors[@]}" -eq 1 ]; then
            out_bool candidate true
            out_match candidate_pr "${survivors[0]}" '^[0-9]+$'
          else
            out_bool candidate false
          fi
          echo "PR #${PR_NUMBER}, head ${head_sha}: ${#survivors[@]} candidate PR(s)."

  decide:
    needs: resolve
    if: needs.resolve.outputs.act == 'true' && needs.resolve.outputs.candidate == 'true'
    permissions:        # a called workflow cannot exceed these
      contents: read
      pull-requests: read
    # >>> CONSUMER: decide pin
    # A full commit SHA plus a version comment, `@<sha> # vX.Y`: a bare tag fails the reusable
    # workflow's SHA check. Keep it equal to the pin in devcontainer-image.yml. Dependabot's
    # github-actions ecosystem bumps both. A bump edits only .github/, so it is never exempt
    # and always needs a review.
    uses: 603-Identity/devcontainers/.github/workflows/devcontainer-bump-decision.yml@2f3bacc7513d82764eccb0cfe4d177d5b3405c42 # v1.3
    # <<< CONSUMER: decide pin
    with:
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      candidate_pr: ${{ needs.resolve.outputs.candidate_pr }}

  post:
    needs: [resolve, decide]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.act == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write       # post the `architect-review` commit status
      contents: write       # arm and disarm auto-merge
      pull-requests: write  # arm and disarm auto-merge
    # One run at a time per (workflow, head SHA), so the status for a SHA comes from one
    # function run serially. GitHub keeps the last-queued run and cancels older PENDING ones
    # while a running one finishes (cancel-in-progress is false so a running post is never
    # cut short mid-write). `post` re-reads reviews and the kill switch when it starts, so
    # those are current. The workflow name is in the key so unrelated workflows never share a
    # group.
    concurrency:
      group: architect-review-${{ github.workflow }}-${{ needs.resolve.outputs.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Compute the status and post it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          CANDIDATE_PR: ${{ needs.resolve.outputs.candidate_pr }}
          DECIDE_RESULT: ${{ needs.decide.result }}
          EXEMPT: ${{ needs.decide.outputs.exempt }}
        run: |
          # Logic of the `post` job of architect-review-gate.yml (design spec v5.2 section 4).
          #
          # This file is the one copy: tools/render-gate.sh inlines it, byte for byte, into the
          # `run:` block of template/.github/workflows/architect-review-gate.yml, and the selftest
          # fails unless the template matches. Edit it here, never in the template.
          #
          # It computes the one status for a head SHA from: the candidate facts (resolve), the
          # decision (decide), the kill switch, and the TARGET PR's reviews. Strings reach it through
          # `env`, never through inline expressions.
          #
          # Inputs (env):
          #   GH_TOKEN         token for `gh api` / `gh pr merge`
          #   REPO             owner/name of this repo
          #   HEAD_SHA         needs.resolve.outputs.head_sha
          #   PR               needs.resolve.outputs.pr
          #   CANDIDATE        needs.resolve.outputs.candidate  (true/false)
          #   CANDIDATE_PR     needs.resolve.outputs.candidate_pr
          #   DECIDE_RESULT    needs.decide.result
          #   EXEMPT           needs.decide.outputs.exempt  (true/false)
          #   RUN_URL          link put on every status
          #   CONTEXT          status context, default architect-review
          #   HEADER, ATTESTATION, REVIEWER_IDS   the per-consumer review values
          #   GITHUB_SERVER_URL  optional, default https://github.com
          set -euo pipefail

          : "${GH_TOKEN:?}" "${REPO:?}" "${HEAD_SHA:?}" "${PR:?}" "${RUN_URL:?}"
          : "${HEADER:?}" "${ATTESTATION:?}" "${REVIEWER_IDS:?}"
          CONTEXT="${CONTEXT:-architect-review}"
          CANDIDATE="${CANDIDATE:-}"
          CANDIDATE_PR="${CANDIDATE_PR:-}"
          DECIDE_RESULT="${DECIDE_RESULT:-}"
          EXEMPT="${EXEMPT:-}"

          # The repo that owns the kill-switch tag. Read with this job's own token (public repo).
          KILL_SWITCH_PATH="repos/603-Identity/devcontainers/git/ref/tags/devc-automerge-on"
          KILL_SWITCH_REF="refs/tags/devc-automerge-on"

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Malformed head SHA or PR number from resolve. Nothing is posted."
            exit 1
          fi

          # target: the candidate PR when there is one, otherwise the PR that triggered the run.
          # Every review lookup, status and disarm below acts on it. A malformed candidate_pr is
          # handled by the error row, which still uses the triggering PR.
          TARGET="$PR"
          if [ "$CANDIDATE" = true ] && [[ "$CANDIDATE_PR" =~ ^[0-9]+$ ]]; then
            TARGET="$CANDIDATE_PR"
          fi
          TARGET_URL="${GITHUB_SERVER_URL:-https://github.com}/${REPO}/pull/${TARGET}"

          post_status() { # state description
            gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="${CONTEXT}" \
              -f description="$2" \
              -f target_url="${RUN_URL}"
          }

          disarm_failed=0
          disarm() {
            # `--disable-auto` on a PR with no auto-merge request errors, which would turn this job red
            # on every run while the kill switch is off. Skip it when the PR is visibly not armed; if
            # that look itself fails, disarm anyway (fail safe).
            local armed
            armed="$(gh pr view "$TARGET_URL" --json autoMergeRequest --jq '.autoMergeRequest // empty' 2> /dev/null)" \
              || armed=unknown
            [ -n "$armed" ] || return 0
            if ! gh pr merge --disable-auto "$TARGET_URL"; then
              echo "::warning::Could not disable auto-merge on PR #${TARGET}."
              disarm_failed=1
            fi
          }

          # Sets KS to: arm (200, right ref), review (404, or 200 with another ref), error (anything
          # else, including 5xx and a network failure).
          KS=error
          read_kill_switch() {
            local resp status body ref
            resp="$(gh api -i "$KILL_SWITCH_PATH" 2> /dev/null || true)"
            resp="$(printf '%s\n' "$resp" | tr -d '\r')"
            status="$(printf '%s\n' "$resp" | awk 'NR == 1 { print $2 }')"
            case "$status" in
              200)
                body="$(printf '%s\n' "$resp" | sed '1,/^$/d')"
                ref="$(printf '%s' "$body" | jq -r 'if type == "object" then (.ref // "") else "" end' 2> /dev/null || true)"
                if [ "$ref" = "$KILL_SWITCH_REF" ]; then KS=arm; else KS=review; fi
                ;;
              404) KS=review ;;
              *) KS=error ;;
            esac
          }

          # Who has edited a review's body: prints `ok` when its edit history is empty, otherwise the
          # space-separated numeric ids of every editor in it (`none` for an editor with no readable id,
          # such as a deleted user), and `unknown` when the node is not a review, the history is longer
          # than one page, or any revision in it was deleted (a deleted revision hides its text, so it fails closed). REST has no edit metadata on reviews, so this is a GraphQL read of
          # `userContentEdits` (#94). The whole history is read, not just the last editor: a writer's edit
          # followed by a reviewer's typo fix must not launder the writer's text. A failed call aborts under
          # `set -e` (called only as `x="$(review_editor ...)"`), so it fails closed, never reads as "unedited".
          # shellcheck disable=SC2016
          review_editor() { # node_id
            gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on PullRequestReview { userContentEdits(first: 100) { totalCount nodes { deletedAt editor { ... on User { databaseId } ... on Bot { databaseId } } } } } } }' \
              -f id="$1" \
              --jq '.data.node as $n | if ($n | type) != "object" or ($n | has("userContentEdits") | not) or ($n.userContentEdits | type) != "object" or ($n.userContentEdits.nodes | type) != "array" then "unknown" elif ($n.userContentEdits.totalCount // 0) > ($n.userContentEdits.nodes | length) then "unknown" elif any($n.userContentEdits.nodes[]; .deletedAt != null) then "unknown" elif ($n.userContentEdits.nodes | length) == 0 then "ok" else ([$n.userContentEdits.nodes[] | (.editor.databaseId // "none" | tostring)] | join(" ")) end'
          }

          # Whether the quote-stripped review body in $1 carries, as a line of its own, the literal
          # `Reviewed against head <HEAD_SHA>` (#278). `commit_id` is the head when the review is posted,
          # not the commit the reviewer read, so a push during the review stamps it onto the new head;
          # this line is the reviewer's own statement of the SHA they pinned, and a moved head fails
          # closed. Leading and trailing whitespace (and a CR) on the line are ignored; backticks around
          # the SHA and one trailing period are accepted (the posting skill's real output, #339, is
          # ``Reviewed against head `<sha>`.``), since the line is markdown prose. Any other
          # text on the line, or a different SHA, does not match.
          reviewed_against_head() { # body
            local line
            while IFS= read -r line; do
              line="${line%$'\r'}"
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              case "$line" in
                "Reviewed against head ${HEAD_SHA}" | "Reviewed against head \`${HEAD_SHA}\`" \
                  | "Reviewed against head ${HEAD_SHA}." | "Reviewed against head \`${HEAD_SHA}\`.") return 0 ;;
              esac
            done <<< "$1"
            return 1
          }

          # The existing review logic. $1 = 1 forces "in scope" (the error row never reads a file list
          # to decide that no review is needed). Plain call, never inside `if`/`||`, so `set -e` stays
          # in force: a failed `gh api` must fail closed, never read as "nothing in scope".
          review_logic() {
            local force_scope="$1" files f touches=0 reviews_json found_at
            local item body at sha uid login node editor editors_ok e

            # Posted first so the required check shows `pending`, not absent, while this runs.
            post_status pending "Checking for a fresh-session review..."

            # Each renamed file's OLD path is checked too (`previous_filename`), so renaming a file
            # out of scope cannot skip review. An empty file list fails closed, because every real PR
            # changes at least one file.
            if [ "$force_scope" = 1 ]; then
              touches=1
            else
              files="$(gh api "repos/${REPO}/pulls/${TARGET}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')"
              if [ -z "$files" ]; then
                post_status failure "PR files API returned no entries -- cannot evaluate scope, failing closed."
                echo
                echo "::error::PR files API returned no entries. Failing closed rather than reporting that no review is required."
                exit 1
              fi
              while IFS= read -r f; do
                # .github/ is ALWAYS in scope, whatever the consumer's list below says: a pin bump of
                # `decide` edits only .github/, and must never be exempt. Not consumer-editable.
                case "$f" in
                  .github/*) touches=1 ;;
                esac
                case "$f" in
                  # >>> CONSUMER: code_paths
                  images/*|template/*|tests/*|.github/*|.claude/*|tools/*) touches=1 ;;
                  .trivyignore.yaml|.gitattributes|.ai/project.yml) touches=1 ;;
                  # <<< CONSUMER: code_paths
                esac
              done <<< "$files"
            fi

            if [ "$touches" != 1 ]; then
              post_status success "No code_paths touched -- no review required."
              return 0
            fi

            # A review qualifies only when it is a formal PR review made against this exact head SHA
            # (`commit_id`). A timestamp would be set by whoever creates the commit (#92), and a comment's
            # body can be edited after the fact by any writer (#94), so comments never count. A review's
            # body can be edited by any writer too (verified on #94: `PUT /pulls/{n}/reviews/{id}` by a
            # non-author with write access succeeds and leaves author, state and `commit_id` unchanged),
            # so a matching review also needs `review_editor` to say it was never edited, or that every
            # editor in its history is an ID in REVIEWER_IDS. A dismissed or pending review is skipped. Captured
            # into a variable, not process substitution, so a failing `gh api` aborts under `set -e`
            # instead of vanishing inside a subshell.
            reviews_json="$(gh api "repos/${REPO}/pulls/${TARGET}/reviews" --paginate --jq '.[] | select(.state != "DISMISSED" and .state != "PENDING") | {body, at: .submitted_at, sha: .commit_id, uid: .user.id, login: .user.login, node: .node_id} | tojson')"

            found_at=""
            while IFS= read -r item; do
              [ -n "$item" ] || continue
              # Quoted lines (`> ...`) are dropped first, so quote-replying someone else's
              # pasted strings does not make the reply qualify.
              body="$(printf '%s' "$item" | jq -r '.body // "" | split("\n") | map(select(test("^\\s*>") | not)) | join("\n")')"
              at="$(printf '%s' "$item" | jq -r '.at // ""')"
              sha="$(printf '%s' "$item" | jq -r '.sha // ""')"
              uid="$(printf '%s' "$item" | jq -r '.uid // ""')"
              login="$(printf '%s' "$item" | jq -r '.login // ""')"
              node="$(printf '%s' "$item" | jq -r '.node // ""')"
              # Who posted it counts: anyone can paste the two strings. Only an ID in REVIEWER_IDS
              # qualifies; a missing or non-numeric ID fails closed. Padding both sides with spaces
              # makes this a whole-word match. The numeric test is load-bearing: it alone stops a
              # missing ID from matching a doubled, leading or trailing space in REVIEWER_IDS
              # (padding turns either into a double space). Keep it.
              if ! [[ "$uid" =~ ^[0-9]+$ && " ${REVIEWER_IDS} " == *" ${uid} "* ]]; then
                # Name the cause in the log, so a skipped review doesn't look like a missing one.
                if [[ "$body" == *"$HEADER"* && "$body" == *"$ATTESTATION"* ]]; then
                  echo "Skipped a matching review by ${login:-<none>} (id ${uid:-<none>}): not in REVIEWER_IDS."
                fi
                continue
              fi
              if [[ "$body" == *"$HEADER"* && "$body" == *"$ATTESTATION"* ]]; then
                if [ "$sha" != "$HEAD_SHA" ]; then
                  echo "Skipped a matching review by ${login:-<none>}: made against ${sha:-<no commit>}, not the head ${HEAD_SHA}."
                  continue
                fi
                if ! reviewed_against_head "$body"; then
                  echo "Skipped a matching review by ${login:-<none>}: no \"Reviewed against head ${HEAD_SHA}\" line, so it may have been read against another commit."
                  continue
                fi
                # A missing node id cannot be looked up, so it fails closed like an unknown editor.
                editor=unknown
                if [ -n "$node" ]; then
                  editor="$(review_editor "$node")"
                fi
                [ -n "$editor" ] || editor=unknown
                editors_ok=1
                if [ "$editor" != ok ]; then
                  for e in $editor; do
                    [[ "$e" =~ ^[0-9]+$ && " ${REVIEWER_IDS} " == *" ${e} "* ]] || editors_ok=0
                  done
                fi
                if [ "$editors_ok" != 1 ]; then
                  echo "Skipped a matching review by ${login:-<none>}: its edit history is ${editor} (every editor must be in REVIEWER_IDS), or it could not be read."
                  continue
                fi
                found_at="$at"
                echo "Qualifying review found, posted ${at}."
                break
              fi
            done <<< "${reviews_json}"

            if [ -n "$found_at" ]; then
              post_status success "Fresh-session review found (${found_at})."
            else
              post_status failure "No fresh-session review posted against this commit yet."
              # `gh api` prints no trailing newline, and the runner reads a workflow command
              # only at the start of a line, so this `echo` is what makes the ::error:: render.
              echo
              echo "::error::No fresh-session review posted against head commit ${HEAD_SHA} yet. A formal PR review by a user in REVIEWER_IDS, made against that commit and containing both \"${HEADER}\" and \"${ATTESTATION}\" and the line \"Reviewed against head ${HEAD_SHA}\", is required."
              # Exit 0 on purpose: the status above is the enforcement.
            fi
            return 0
          }

          # The decision table. mode is one of: plain, arm, disarm-review, error.
          mode=error
          case "$CANDIDATE" in
            false)
              # Not a candidate: decide was skipped, and whatever it said is ignored.
              mode=plain
              ;;
            true)
              if [[ "$CANDIDATE_PR" =~ ^[0-9]+$ ]]; then
                case "$DECIDE_RESULT" in
                  success)
                    case "$EXEMPT" in
                      true)
                        read_kill_switch
                        case "$KS" in
                          arm) mode=arm ;;
                          review) mode=disarm-review ;;
                          *) mode=error ;;
                        esac
                        ;;
                      false) mode=disarm-review ;;
                      *) mode=error ;;
                    esac
                    ;;
                  *) mode=error ;; # failure, cancelled, skipped, or anything unknown
                esac
              fi
              ;;
          esac
          echo "Gate row: candidate='${CANDIDATE}' decide='${DECIDE_RESULT}' exempt='${EXEMPT}' -> ${mode} (target PR #${TARGET})."

          case "$mode" in
            plain)
              review_logic 0
              ;;
            arm)
              # No `pending` here: the exempt path never shows a pending check.
              post_status success "Verified image bump -- exempt from review."
              gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$TARGET_URL"
              ;;
            disarm-review)
              disarm
              review_logic 0
              ;;
            *)
              echo "::warning::Decision inputs are missing or malformed (or the kill switch could not be read): never arming, sending this PR to review."
              disarm
              review_logic 1
              ;;
          esac

          if [ "$disarm_failed" != 0 ]; then
            exit 1
          fi
